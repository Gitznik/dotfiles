general {
    lock_cmd = pidof swaylock || swaylock --daemonize
    before_sleep_cmd = loginctl lock-session
    # 3 = hold suspend until the session is actually locked (needed for non-hyprlock lockers)
    inhibit_sleep = 3
}

# Screensaver early, lock late (OLED). Any input closes it.
listener {
    timeout = 150
    on-timeout = $HOME/.local/bin/screensaver-launch
    on-resume = pkill -f '[l]ocal.screensaver'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Display off only after the lock is up. Guarded enable: re-enabling an already-on
# output forces a modeset that blanks the screen.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl monitors -j | jq -e 'all(.[]; .dpmsStatus)' >/dev/null || hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
