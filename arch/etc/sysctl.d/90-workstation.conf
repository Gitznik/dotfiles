# Managed by arch/bootstrap.sh (installed under /etc).
# File watchers for editors, dev servers, docker compose watch.
fs.inotify.max_user_watches = 524288
# Swap is zram (compressed RAM): swap eagerly, read single pages (Arch wiki, zram).
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
